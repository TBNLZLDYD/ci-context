[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ci-context"
version = "0.1.0b1"
description = "One command to get full CI failure context — errors, commit diff, PR context, and history patterns."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "TBNLZLDYD" },
]
keywords = ["ci", "github-actions", "cli", "developer-tools", "failure-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12,<1",
    "rich>=13.0,<14",
    "pygithub>=2.3,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "vcrpy>=6.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
ci-context = "ci_context.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_context"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.mypy]
python_version = "3.11"
strict = true
