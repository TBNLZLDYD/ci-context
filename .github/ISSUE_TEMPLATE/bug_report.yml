name: Bug report
description: Report a bug or unexpected behaviour in ci-context.
title: "Bug: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what were you trying to do?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: |
        The smallest command (or sequence) that reproduces the problem.
        Example:
          ci-context gh run <run-id> --repo owner/repo
      placeholder: |
        1.
        2.
        3.

  - type: input
    id: version
    attributes:
      label: ci-context version
      description: Output of `ci-context --version`.
      placeholder: ci-context --version

  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version` (or `uv run python --version`).
      placeholder: Python 3.11.x

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where are you running ci-context?
      options:
        - Windows
        - macOS
        - Linux
        - GitHub Codespaces
        - Other (describe in description)

  - type: textarea
    id: terminal-output
    attributes:
      label: Terminal output (redact tokens/private data)
      description: |
        Paste the relevant output (full traceback if any). Please redact
        tokens, repository URLs containing secrets, and any private data.

        Note: ci-context is local-first. Logs are processed on your machine;
        only the GitHub API calls you'd make with `gh` leave the box.

  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual behaviour
      description: What did you expect to happen, and what actually happened?
